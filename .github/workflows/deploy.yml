# ============================================================
# BarberAgenda — CI/CD com GitHub Actions
# Push para main → build → push registry → deploy no Swarm
# ============================================================

name: Deploy BarberAgenda

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite trigger manual no GitHub

env:
  REGISTRY: ${{ secrets.EASYPANEL_REGISTRY }}
  PROJECT: barberflow

jobs:
  # ── Build e push da imagem ──────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Registry EasyPanel
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.EASYPANEL_REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Metadata da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT }}/app
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.PROJECT }}/app:latest
          cache-to: type=inline

  # ── Deploy no Docker Swarm via SSH ─────────────────────────
  deploy:
    name: Deploy Swarm
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd /opt/barberflow

            # Puxa a versão mais recente do compose
            git pull origin main

            # Faz login no registry e deploia
            echo "${{ secrets.REGISTRY_PASSWORD }}" | \
              docker login ${{ secrets.EASYPANEL_REGISTRY }} \
                -u ${{ secrets.REGISTRY_USER }} --password-stdin

            # Deploy com a nova tag
            export REGISTRY=${{ secrets.EASYPANEL_REGISTRY }}
            export PROJECT=barberflow
            export TAG=${{ needs.build.outputs.image_tag }}

            docker stack deploy \
              --compose-file docker-compose.swarm.yml \
              --with-registry-auth \
              --prune \
              barberflow

            echo "✅ Deploy concluído: tag $TAG"

      - name: Notifica deploy (Slack/Discord — opcional)
        if: success()
        run: |
          echo "Deploy realizado com sucesso! Tag: ${{ needs.build.outputs.image_tag }}"
          # Adicione aqui webhook do Slack ou Discord se quiser notificações
