###############################################################################
# BarberFlow SaaS — docker-compose.easypanel.yml
#
# Domínios (via Traefik/EasyPanel):
#   Frontend : barberflow-barberflow.i9inu5.easypanel.host  → app:80
#   API      : barberflow-api.i9inu5.easypanel.host         → api:4000
#   Supabase : barberflow-supabase.i9inu5.easypanel.host    → kong:8000 (projeto separado)
###############################################################################

version: "3.9"

services:

  ##############################################################################
  # REDIS
  ##############################################################################
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barberflow
      - supabase_net

  ##############################################################################
  # APP — Frontend React (nginx)
  # SUPABASE_URL deve ser a URL PÚBLICA do Supabase (acessível pelo browser)
  ##############################################################################
  app:
    image: barberflow-app:latest
    restart: unless-stopped
    environment:
      # URL pública — browser do usuário acessa de fora da rede Docker
      SUPABASE_URL: https://barberflow-supabase.i9inu5.easypanel.host
      # Chave anon do Supabase instalado (demo key — trocar ao atualizar o Supabase)
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE
      # URL pública da API Express
      API_URL: https://barberflow-api.i9inu5.easypanel.host
      SITE_URL: https://barberflow-barberflow.i9inu5.easypanel.host
      EVO_URL: ${EVO_URL}
      EVO_INSTANCE: ${EVO_INSTANCE:-barberflow}
      EVO_APIKEY: ${EVO_APIKEY}
      EVO_GLOBAL_KEY: ${EVO_GLOBAL_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - barberflow
      - supabase_net

  ##############################################################################
  # API — Backend Express (registro + webhook Asaas)
  # SUPABASE_URL aqui é interna (servidor-para-servidor, não precisa ser pública)
  ##############################################################################
  api:
    image: barberflow-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVER_PORT: 4000
      # Kong interno — acesso servidor-para-servidor, não pelo browser
      SUPABASE_URL: http://kong:8000
      # Service role key do Supabase instalado (demo key — trocar ao atualizar o Supabase)
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASAAS_WEBHOOK_SECRET: ${ASAAS_WEBHOOK_TOKEN}
      CORS_ORIGIN: https://barberflow-barberflow.i9inu5.easypanel.host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - barberflow
      - supabase_net
      - easypanel

##############################################################################
# VOLUMES
##############################################################################
volumes:
  redis_data:

##############################################################################
# NETWORKS
##############################################################################
networks:
  barberflow:
    driver: bridge

  # Rede do Supabase já existente
  supabase_net:
    external: true
    name: barberflow_supabase_default

  # Rede do Traefik/EasyPanel — necessária para roteamento por domínio
  easypanel:
    external: true
    name: easypanel
