###############################################################################
# BarberFlow SaaS — docker-compose.easypanel.yml
#
# Domínios (via Traefik/EasyPanel):
#   Frontend : workagenda.org / www.workagenda.org  → app:80
#   API      : api.workagenda.org                   → api:4000
#   Supabase : barberflow-supabase.i9inu5.easypanel.host    → kong:8000 (projeto separado)
###############################################################################

version: "3.9"

services:

  ##############################################################################
  # REDIS
  ##############################################################################
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barberflow
      - supabase_net

  ##############################################################################
  # APP — Frontend React (nginx)
  # SUPABASE_URL deve ser a URL PÚBLICA do Supabase (acessível pelo browser)
  ##############################################################################
  app:
    image: barberflow-app:latest
    restart: unless-stopped
    mem_limit: 256m
    environment:
      # URL pública — browser do usuário acessa de fora da rede Docker
      SUPABASE_URL: https://barberflow-supabase.i9inu5.easypanel.host
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgyMzMwNTI1LCJleHAiOjI0MTMwNTA1MjV9.Uc53YlcgAhrKRFlw824T-HBs4nDZaxhxTzub6aH77NU
      # URL pública da API Express
      API_URL: https://api.workagenda.org
      SITE_URL: https://workagenda.org
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      barberflow:
      supabase_net:
      easypanel:
        aliases:
          - barberflow_barberflow_app

  ##############################################################################
  # API — Backend Express (registro + webhook Asaas)
  # SUPABASE_URL aqui é interna (servidor-para-servidor, não precisa ser pública)
  ##############################################################################
  api:
    image: barberflow-api:latest
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NODE_ENV: production
      SERVER_PORT: 4000
      # Kong interno — acesso servidor-para-servidor, não pelo browser
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3ODIzMzA1MjUsImV4cCI6MjQxMzA1MDUyNX0.3aqiwuVXh5UwDAY5Y3KyfSmPGVtN6C8Rj1hhl6-M86E
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASAAS_WEBHOOK_SECRET: ${ASAAS_WEBHOOK_TOKEN}
      ASAAS_SANDBOX: ${ASAAS_SANDBOX:-false}
      CORS_ORIGIN: https://workagenda.org
      SITE_URL: https://workagenda.org
      API_PUBLIC_URL: https://api.workagenda.org
      RESEND_API_KEY: re_2BLvozWY_LdyvwfYJyQaWyLTZVbRiHp4B
      # Evolution Go — URL interna do EasyPanel (nunca exposta ao browser)
      EVO_URL: http://evolutionapi_evogo:8080
      EVO_GLOBAL_KEY: 8f91c3d5-e2a7-4b60-9d88-1c4e7f0b5a22
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      barberflow:
      supabase_net:
      easypanel:
        aliases:
          - barberflow_barberflow_api

##############################################################################
# VOLUMES
##############################################################################
volumes:
  redis_data:

##############################################################################
# NETWORKS
##############################################################################
networks:
  barberflow:
    driver: bridge

  # Rede do Supabase já existente
  supabase_net:
    external: true
    name: barberflow_supabase_default

  # Rede do Traefik/EasyPanel — necessária para roteamento por domínio
  easypanel:
    external: true
    name: easypanel
