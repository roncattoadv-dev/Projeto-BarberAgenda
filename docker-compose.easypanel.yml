###############################################################################
# BarberFlow SaaS — docker-compose.easypanel.yml
#
# ATUALIZADO 2026-07-31 no corte de auth própria (GoTrue/Kong eliminados —
# ver commit "auth: replace Supabase (GoTrue/Kong) with self-hosted Postgres
# + custom auth"). Reflete a arquitetura REAL rodando em produção nesta
# data: Postgres puro + PostgREST + Express (auth própria), sem GoTrue/Kong/
# Supabase Storage/Realtime. Os containers reais já rodavam com esses nomes
# via `docker run` manual antes deste arquivo ser atualizado — ver
# container_name abaixo, escolhido para bater exatamente com o que já
# estava no ar (evita recriar postgres/postgrest do zero ao aplicar isto).
#
# Domínios (via Traefik/EasyPanel, roteamento por alias de rede Docker):
#   Frontend : workagenda.org / www.workagenda.org  → app:80
#   API      : api.workagenda.org                   → api:4000
#   PostgREST: barberflow-supabase.i9inu5.easypanel.host → postgrest:8000
#              (endereço herdado do Kong antigo — mantido de propósito
#              pra não precisar reconfigurar Traefik nem o app já em produção)
#
# IMPORTANTE — variáveis novas necessárias no .env deste projeto no EasyPanel
# (já adicionadas manualmente em 2026-07-31, ver
# /etc/easypanel/projects/barberflow/barberflow/code/.env):
#   BARBERFLOW_JWT_SECRET, BARBERFLOW_SUPABASE_SERVICE_KEY,
#   BARBERFLOW_DB_APP_PASSWORD, BARBERFLOW_DB_SUPERUSER_PASSWORD,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
###############################################################################

version: "3.9"

services:

  ##############################################################################
  # REDIS
  ##############################################################################
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barberflow
      - supabase_net

  ##############################################################################
  # POSTGRES — banco próprio (substitui o Postgres do Supabase self-hosted)
  # Volume EXTERNO (já existe com os dados reais, ver aviso no topo do arquivo)
  ##############################################################################
  postgres:
    image: postgres:16-alpine
    container_name: barberflow-prod-pg
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: barberflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BARBERFLOW_DB_SUPERUSER_PASSWORD}
    volumes:
      - barberflow_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      supabase_net:
        aliases:
          - barberflow-prod-pg

  ##############################################################################
  # POSTGREST — API REST direta sobre o Postgres (substitui Kong+PostgREST
  # antigos do Supabase). Assume o endereço público que o Kong usava, via
  # alias barberflow_supabase_kong na rede easypanel — nenhuma mudança de
  # DNS/Traefik necessária.
  ##############################################################################
  postgrest:
    image: postgrest/postgrest:latest
    container_name: barberflow-postgrest-prod
    restart: unless-stopped
    mem_limit: 128m
    environment:
      PGRST_DB_URI: postgres://authenticator:${BARBERFLOW_DB_SUPERUSER_PASSWORD}@barberflow-prod-pg:5432/barberflow
      PGRST_DB_SCHEMAS: barber,public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${BARBERFLOW_JWT_SECRET}
      PGRST_SERVER_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      supabase_net:
        aliases:
          - kong                      # api usa SUPABASE_URL=http://kong:8000 — mantido de propósito
      easypanel:
        aliases:
          - barberflow_supabase_kong  # endereço público que o Kong antigo respondia

  ##############################################################################
  # APP — Frontend React (nginx)
  # SUPABASE_URL deve ser a URL PÚBLICA acessível pelo browser — continua
  # sendo o domínio do Kong antigo, agora servido pelo PostgREST (ver acima).
  ##############################################################################
  app:
    image: barberflow-app:latest
    restart: unless-stopped
    mem_limit: 256m
    environment:
      SUPABASE_URL: https://barberflow-supabase.i9inu5.easypanel.host
      API_URL: https://api.workagenda.org
      SITE_URL: https://workagenda.org
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      barberflow:
      supabase_net:
      easypanel:
        aliases:
          - barberflow_barberflow_app

  ##############################################################################
  # API — Backend Express (auth própria + registro + WhatsApp + webhook Asaas)
  # SUPABASE_URL aqui é interna (servidor-para-servidor) — continua
  # http://kong:8000 de propósito, ver alias do serviço postgrest acima.
  ##############################################################################
  api:
    image: barberflow-api:latest
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NODE_ENV: production
      SERVER_PORT: 4000
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_KEY: ${BARBERFLOW_SUPABASE_SERVICE_KEY}
      DATABASE_URL: postgres://app_backend:${BARBERFLOW_DB_APP_PASSWORD}@barberflow-prod-pg:5432/barberflow
      JWT_SECRET: ${BARBERFLOW_JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASAAS_SANDBOX_KEY: ${ASAAS_SANDBOX_KEY}
      ASAAS_WEBHOOK_SECRET: ${ASAAS_WEBHOOK_TOKEN}
      ASAAS_SANDBOX: ${ASAAS_SANDBOX:-false}
      CORS_ORIGIN: https://workagenda.org
      SITE_URL: https://workagenda.org
      API_PUBLIC_URL: https://api.workagenda.org
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Evolution Go — URL interna do EasyPanel (nunca exposta ao browser)
      EVO_URL: http://evolutionapi_evogo:8080
      EVO_GLOBAL_KEY: ${EVO_GLOBAL_KEY}
    volumes:
      - barberflow_uploads_data:/data/uploads   # logos de tenant — NUNCA remover este mount
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      barberflow:
      supabase_net:
      easypanel:
        aliases:
          - barberflow_barberflow_api

##############################################################################
# VOLUMES
##############################################################################
volumes:
  redis_data:

  # Já existem com dados reais (criados manualmente no corte de 2026-07-31) —
  # external:true impede o compose de criar volumes novos VAZIOS com esses
  # nomes prefixados pelo projeto, o que apagaria tudo silenciosamente.
  barberflow_postgres_data:
    external: true
    name: barberflow_postgres_data_v2
  barberflow_uploads_data:
    external: true
    name: barberflow_uploads_data

##############################################################################
# NETWORKS
##############################################################################
networks:
  barberflow:
    driver: bridge

  # Rede compartilhada com o antigo projeto Supabase — mantida para o
  # PostgREST/Postgres novos, sem precisar mexer nela
  supabase_net:
    external: true
    name: barberflow_supabase_default

  # Rede do Traefik/EasyPanel — necessária para roteamento por domínio
  easypanel:
    external: true
    name: easypanel
