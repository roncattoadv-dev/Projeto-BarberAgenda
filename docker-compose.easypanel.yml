# ============================================================
# BarberAgenda SaaS — Docker Compose para EasyPanel
# ============================================================
# COMO USAR NO EASYPANEL:
#
# 1. New Project → Custom Compose
# 2. Cole este arquivo inteiro
# 3. Clique em "Environment" e preencha as variáveis marcadas
#    com <<PREENCHA>> antes de fazer deploy
# 4. Deploy
#
# O EasyPanel vai:
#   - Subir Postgres e Redis automaticamente com volumes
#   - Buildar o app direto do GitHub
#   - Gerar domínio + HTTPS automático
# ============================================================

services:

  # ──────────────────────────────────────────────────────────
  # APP — Frontend React (buildado pelo EasyPanel via GitHub)
  # ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      NODE_ENV: production
      # ── Evo Go / WhatsApp ──────────────────────────────────
      # Também pode configurar direto na aba WhatsApp do app
      VITE_EVO_URL:      ${VITE_EVO_URL:-}
      VITE_EVO_INSTANCE: ${VITE_EVO_INSTANCE:-barberflow}
      VITE_EVO_APIKEY:   ${VITE_EVO_APIKEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ──────────────────────────────────────────────────────────
  # POSTGRES 16
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-barberflow}
      POSTGRES_USER:     ${POSTGRES_USER:-barber_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-<<PREENCHA_SENHA_POSTGRES>>}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barber_user} -d ${POSTGRES_DB:-barberflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────────────────
  # REDIS 7
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-<<PREENCHA_SENHA_REDIS>>}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-senha}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # PGADMIN — acesse em :5050 (pode remover em produção)
  # ──────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@barberflow.com.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-<<PREENCHA_SENHA_PGADMIN>>}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
